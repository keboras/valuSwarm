<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask — OmniWealth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:opsz,wght@9..144,500&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css?v=ow6" />
</head>
<body class="ow">
  <aside class="ow-rail" id="nav" aria-label="OmniWealth stations"></aside>
  <main class="container">
    <header>
      <p class="ow-kicker muted small">05 · Ask</p>
      <h1>Advisor</h1>
      <p class="muted">Optional side panel. Answers use your saved profile. It does not move money.</p>
      <p class="muted small">Need a file? Open <a href="/static/studio.html">Studio</a>.</p>
    </header>
    <p id="advisor-status" class="alert hidden"></p>
    <div id="esbi-context" class="card esbi-context hidden"></div>
    <p class="small muted disclaimer">Educational guidance only — not licensed tax, legal, or investment advice.</p>

    <div id="starter-chips" class="emotion-btns" style="margin: 1rem 0;"></div>

    <section class="card chat-panel">
      <div class="chat-toolbar">
        <span class="small muted">Conversations are saved so your advisor remembers you.</span>
        <button type="button" id="clear-chat" class="btn btn-secondary btn-sm">Clear chat</button>
      </div>
      <div id="chat-log" class="chat-log"></div>
      <form id="chat-form" class="fork-form">
        <input id="chat-input" placeholder="Ask about debt, taxes, budget, credit…" required />
        <button type="submit" class="btn">Send</button>
      </form>
    </section>
  </main>
  <script type="module" src="/static/js/advisor.js?v=5"></script>
</body>
</html>
